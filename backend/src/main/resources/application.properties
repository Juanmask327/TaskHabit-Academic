# =====================================================================================
#  Configuración del backend TaskHabit Academic.
#  Sintaxis ${VARIABLE:valor} = usa la variable de entorno VARIABLE si existe; si no,
#  usa "valor". Así en desarrollo funciona sin configurar nada y en producción se
#  cambian las credenciales sin tocar el código.
# =====================================================================================

spring.application.name=academic-api

# --- Servidor HTTP ---
# Puerto 8000 y prefijo /api para que la app Android (ApiClient.BASE_URL = http://IP:8000/api/)
# funcione sin cambiar nada más que la IP.
server.port=${PORT:8000}
server.servlet.context-path=/api
# Solo escucha en el propio PC (127.0.0.1): ningún otro equipo de la red puede conectarse.
# El teléfono llega por el túnel USB de "adb reverse" y el emulador por 10.0.2.2 (ver README).
# Para exponerlo en la red (no recomendado): variable de entorno SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# --- Conexión a PostgreSQL (JDBC) ---
# jdbc:postgresql://<host>:<puerto>/<nombre_bd>. PostgreSQL instalado en Windows (puerto 5432)
# con la base "taskhabit" y el usuario "taskhabit" (ver README.md, sección "Base de datos").
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskhabit}
spring.datasource.username=${DB_USER:taskhabit}
spring.datasource.password=${DB_PASSWORD:taskhabit}

# --- JPA / Hibernate ---
# validate = Hibernate NO crea ni modifica tablas: solo verifica al arrancar que las clases
# @Entity coinciden con las tablas. Quien crea las tablas es Flyway (scripts en db/migration).
# (Alternativa "update" es cómoda pero peligrosa: altera tablas sin dejar rastro.)
spring.jpa.hibernate.ddl-auto=validate
# Desactiva "Open Session In View": la conexión a la BD se cierra al terminar el @Transactional
# del servicio, no al terminar la petición HTTP. Obliga a cargar los datos en la capa de servicio.
spring.jpa.open-in-view=false

# --- Flyway (migraciones del esquema) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Seguridad: tokens de Firebase ---
# ID del proyecto Firebase (está en app/google-services.json -> "project_id").
# Con este dato se valida que el token lo emitió NUESTRO proyecto y no otro.
taskhabit.firebase.project-id=${FIREBASE_PROJECT_ID:taskhabit-academic-7f78c}

# --- Logs didácticos ---
# Imprime en consola cada sentencia SQL que Hibernate envía a PostgreSQL (INSERT, SELECT...).
# Muy útil para entender el CRUD; se puede apagar cambiando DEBUG por INFO.
logging.level.org.hibernate.SQL=DEBUG
# Imprime también los valores de los parámetros (?) de cada SQL.
logging.level.org.hibernate.orm.jdbc.bind=TRACE
