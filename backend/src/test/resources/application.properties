# Configuración SOLO para las pruebas: reemplaza la de src/main/resources.
# H2 en memoria imitando a PostgreSQL; Flyway ejecuta los mismos scripts V1__...
# y Hibernate valida las entidades contra esas tablas (igual que en producción).
spring.datasource.url=jdbc:h2:mem:taskhabit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.context-path=/api
taskhabit.firebase.project-id=proyecto-de-prueba
